<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2a111b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Chess Gambl"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Chess Gambl</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#1c1018;color:#fff4f4;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}body{background:radial-gradient(circle at 20% 0%,#4a1b28 0%,#29121c 46%,#160e16 100%)}.app{width:100%;max-width:560px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 24px);gap:0}.header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.header h1{font-size:clamp(28px,5vw,36px);letter-spacing:-1.2px;margin:0;font-weight:850}.reset{height:53px;width:53px;display:grid;place-items:center;background:#5d2937;border:1px solid #95606b;border-radius:16px;color:#ffe9ec}.reset svg{width:26px;height:26px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:clamp(65px,13dvh,140px)}.turn{height:34px;color:#f9d8db;font-size:clamp(18px,4.2vw,22px);font-weight:650;letter-spacing:.05px;text-align:center}.counter{font-size:23px;font-weight:800;color:#eeb1bb;margin:15px 0 34px;min-height:29px;text-align:center}.pieces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:clamp(9px,3vw,18px)}.piece{aspect-ratio:1/1;border:1.5px solid #9d5b68;border-radius:20px;background:linear-gradient(150deg,#612b3d,#42202f);display:grid;place-items:center;box-shadow:0 12px 25px #10070d35;overflow:hidden}.piece span{font-family:"DejaVu Sans","Segoe UI Symbol","Arial Unicode MS",serif;font-size:clamp(65px,16vw,107px);line-height:1;color:#fff1e9;text-shadow:0 4px 12px #1f0e14a1}.piece.black span{color:#211219;-webkit-text-stroke:1.5px #f2c5cd;text-shadow:0 0 15px #ffcbda55}.bottom{flex-shrink:0;margin-bottom:clamp(8px,3vh,30px)}.roll{width:100%;height:clamp(72px,11dvh,90px);border:0;border-radius:20px;background:linear-gradient(135deg,#f6b4c2,#ef889f);color:#4f1427;font-size:25px;font-weight:800;box-shadow:0 9px 26px #0004}.roll:active{transform:scale(.99);filter:brightness(.96)}.copyright{font-size:12px;text-align:center;color:#ac8290;margin-top:18px}.hidden{visibility:hidden}.modalWrap[hidden]{display:none}.modalWrap{position:fixed;inset:0;padding:20px;background:#0b080ac9;display:flex;align-items:center;justify-content:center}.modal{max-width:360px;width:100%;background:#f9e9e9;color:#401924;padding:24px;border-radius:22px}.modal h2{margin:0 0 10px}.modal p{line-height:1.4}.modalButtons{display:flex;gap:12px;margin-top:20px}.modalButtons button{flex:1;padding:13px;border-radius:12px;border:0;font-weight:750}.yes{background:#8d2946;color:white}.no{background:#e5cdd3;color:#46172a}@media(max-height:640px){.main{padding-top:clamp(20px,8dvh,60px)}.counter{margin-bottom:16px}.app{padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}.piece{border-radius:13px}.copyright{margin-top:8px}}
</style></head><body><div class="app"><header class="header"><h1>Chess Gambl</h1><button class="reset" id="reset" aria-label="Nova partija" title="Nova partija"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.8-6.5"/><path d="M3 3v6h6"/></svg></button></header><main class="main"><div class="turn" id="turn" aria-live="polite"></div><div class="counter" id="counter"></div><section class="pieces" aria-label="Odabrane šahovske figure"><div class="piece" id="p0"><span></span></div><div class="piece" id="p1"><span></span></div><div class="piece" id="p2"><span></span></div></section></main><footer class="bottom"><button class="roll" id="roll">Zavrti</button><div class="copyright">© Pecinjak 2026</div></footer></div><div class="modalWrap" id="confirm" hidden><div class="modal"><h2>Nova partija?</h2><p>Brojač će se vratiti na početak, a figure će se isprazniti.</p><div class="modalButtons"><button class="no" id="cancel">Odustani</button><button class="yes" id="accept">Resetiraj</button></div></div></div>
<script>
(()=>{'use strict';const symbols={P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔',p:'♟︎',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};const all=['P','N','B','R','Q','K'];const first=['P','N','B','Q','K'];const key='chess-gambl-v1';let count=0,pieces=[];try{const data=JSON.parse(localStorage.getItem(key));if(data&&Number.isInteger(data.count)&&data.count>=0&&Array.isArray(data.pieces)&&data.pieces.length===3){count=data.count;pieces=data.pieces}}catch{}const turn=document.getElementById('turn'),counter=document.getElementById('counter'),cells=[0,1,2].map(i=>document.getElementById('p'+i));function rand(max){if(globalThis.crypto&&crypto.getRandomValues){const b=new Uint32Array(1);const limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(b)}while(b[0]>=limit);return b[0]%max}return Math.floor(Math.random()*max)}function pick(a){return a[rand(a.length)]}function render(){turn.textContent=count===0?'':count%2===1?'Bijeli je na potezu':'Crni je na potezu';counter.textContent=count?count+'.':'';cells.forEach((cell,i)=>{const p=pieces[i];cell.classList.toggle('black',count%2===0&&count>0);cell.querySelector('span').textContent=p?(count%2===0?symbols[p.toLowerCase()]:symbols[p]):''});try{localStorage.setItem(key,JSON.stringify({count,pieces}))}catch{}}function roll(){count++;const pool=count<=2?first:all;pieces=Array.from({length:3},()=>pick(pool));if(count<=2&&!pieces.includes('P'))pieces[rand(3)]='P';render()}function reset(){count=0;pieces=[];render()}const confirm=document.getElementById('confirm');document.getElementById('roll').addEventListener('click',roll);document.getElementById('reset').addEventListener('click',()=>{if(count)confirm.hidden=false;else reset()});document.getElementById('cancel').addEventListener('click',()=>confirm.hidden=true);document.getElementById('accept').addEventListener('click',()=>{reset();confirm.hidden=true});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
